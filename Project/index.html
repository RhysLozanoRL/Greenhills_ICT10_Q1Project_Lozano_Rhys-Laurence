<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- PyScript CSS -->
        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.2/core.css" />
    <!-- PyScript JavaScript -->
        <script type="module" src="https://pyscript.net/releases/2026.7.2/core.js"></script>
    <title>Main / Home Page</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fdbad5, #b46673);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-box {
            background: white;
            width: 400px;
            padding: 45px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            color: #540d16;
            margin: 5px 0 10px;
            font-size: 28px;
        }

        p {
            color: #777;
            font-size: 13px;
            margin-bottom: 30px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .receipt-button {
            background: linear-gradient(90deg, #c1516d, #cd6991);
            color: white;
        }

        .sku-button {
            background: linear-gradient(90deg, #c1516d, #cd6991);
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .footer {

            position: fixed;
            bottom: 0;
            width: 100%;
            height: 33px;
            background: #791d3d;
            color: #ddd;
            text-align: center;
            padding: 9px;
            font-size: 9px;
        }

    </style>

</head>


<body>
    <div class="welcome-box">
        <div class="icon">
            ☕
    </div>

    <h1>
        Welcome ! Pick a Generator !
    </h1>

    <p>
        Choose a generator to get started !
    </p>

<!-- Creates the buttpms for the receipt & sku generator, it leads you to their webpages -->
    <button class="receipt-button" onclick="location='receipt.html'">
        ☕ Receipt Generator
    </button>

    <button class="sku-button" onclick="location='sku.html'">
         ♡ SKU Generator
    </button>

     </div>
        <div class="footer">
            ♡ Skew — 1st Quarter Project - Lozano 10 - Topaz
    </div>

</body>
<!--Sources-->
<!-- Python CSS: https://www.w3schools.com/css/
 Used for reference with the Python CSS used throughout the whole project -->
</html>
